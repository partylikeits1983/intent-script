[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "test/fixtures" }]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# Fork test profile — uses ETH_RPC_URL env var
[profile.fork]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "test/fixtures" }]
